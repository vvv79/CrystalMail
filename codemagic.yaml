workflows:
  ios-unsigned:
    name: CrystalMail iOS (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: CrystalMail.xcodeproj
        XCODE_SCHEME: CrystalMail
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
          echo "===== GENERATED Info.plist ====="
          plutil -p CrystalMail/Info.plist || cat CrystalMail/Info.plist
          (plutil -p CrystalMail/Info.plist || cat CrystalMail/Info.plist) > generated_info_plist.txt 2>&1
      - name: Build unsigned .app
        script: |
          set +e
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          echo "=========== ERRORS (скопируй эти строки) ==========="
          grep -n "error:" build.log || echo "строк 'error:' нет"
          echo "=========== BUILD EXIT CODE: $STATUS ==========="
          echo "===== APP Info.plist (ATS) ====="
          (plutil -p build/Build/Products/Debug-iphoneos/CrystalMail.app/Info.plist || true) > app_info_plist.txt 2>&1
          cat app_info_plist.txt || true
          if [ $STATUS -ne 0 ]; then
            echo "=========== TAIL OF LOG ==========="
            tail -n 40 build.log
            exit $STATUS
          fi
      - name: Package unsigned .ipa
        script: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/CrystalMail.app Payload/
          zip -r CrystalMail-unsigned.ipa Payload
    artifacts:
      - CrystalMail-unsigned.ipa
      - build.log
      - generated_info_plist.txt
      - app_info_plist.txt
