name: CrystalMail
options:
  bundleIdPrefix: com.crystalmail
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  CrystalMail:
    type: application
    platform: iOS
    sources:
      - path: CrystalMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crystalmail.ios
        INFOPLIST_FILE: CrystalMail/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
